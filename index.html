<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業・タスク管理ダッシュボード</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <h2>📝 マイ・ダッシュボード</h2>
        
        <div class="input-area">
            <input type="text" id="courseQuery" placeholder="シラバスを検索（例：センシング）">
            <button class="add-btn" onclick="searchAndAdd()">追加</button>
        </div>

        <div id="loadingMessage" class="loading" style="display: none;"></div>
        
        <table class="timetable">
            <thead>
                <tr>
                    <th class="period-col"></th>
                    <th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th>
                </tr>
            </thead>
            <tbody id="timetableBody">
                </tbody>
        </table>

        <h3 class="sub-title">📌 その他の授業・未定</h3>
        <div id="unassignedList" class="unassigned-area"></div> 
    </div>

    <script src="script.js?v=9"></script>
</body>
</html>
